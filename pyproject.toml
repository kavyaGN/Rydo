[project]
name = "rydo"
version = "0.1.0"
description = "AI-enabled ride booking platform: FastAPI, PostgreSQL, Redis, React."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/**/__init__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long lines are handled by the formatter's line-length
    "B008",  # FastAPI's Depends()/Query() in defaults is the intended pattern
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy relationships reference sibling models by string name on purpose.
"app/infrastructure/database/models/*.py" = ["F821"]
