# One command runs the whole system:  docker compose up --build
#   Web app  -> http://localhost:5173
#   API docs -> http://localhost:8000/docs
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rydo_api
    env_file:
      - .env.example
    environment:
      # Inside Docker, services reach each other by service name, not localhost.
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    # The image's default command applies migrations and seeds demo data before serving.
    # It also serves the web app itself at http://localhost:8000 (same build as production).

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: rydo_web
    ports:
      - "5173:80"
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    container_name: rydo_postgres
    environment:
      POSTGRES_DB: ride_booking
      POSTGRES_USER: ride_booking
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ride_booking -d ride_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: rydo_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    # Pinned to match the chromadb Python client in requirements.txt.
    image: chromadb/chroma:1.0.15
    container_name: rydo_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data

volumes:
  postgres_data:
  redis_data:
  chroma_data:
